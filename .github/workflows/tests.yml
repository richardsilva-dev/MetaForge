name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m metaforge.cli run --size 80 --generations 2 --seed 7 --max-evaluations 16 --max-workers 2 --global-timeout 30
      - run: test -s .artifacts/latest.json && test -s .artifacts/latest.md

  optional-agent-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,orchestration,llm]"
      - run: python -m pytest

  compiled-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: rustc --version && cargo --version && cc --version
      - run: python -m pytest tests/test_backends.py
      - run: python -m metaforge.cli backend-check --backend both --strategy heapsort --size 1000 --repeats 3
