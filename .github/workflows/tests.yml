name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m metaforge.cli run --size 80 --generations 2 --seed 7 --max-evaluations 16 --max-workers 2 --global-timeout 30
      - run: test -s .artifacts/latest.json && test -s .artifacts/latest.md

  optional-agent-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,orchestration,llm]"
      - run: python -m pytest

  compiled-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: rustc --version && cargo --version && cc --version
      - run: cargo fmt --manifest-path backends/rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path backends/rust/Cargo.toml -- -D warnings
      - run: cc -std=c11 -Wall -Wextra -Werror -fanalyzer -fsyntax-only backends/c/main.c
      - run: python -m pytest tests/test_backends.py
      - run: python -m metaforge.cli backend-check --backend both --strategy heapsort --size 1000 --repeats 3

  property-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,fuzz]"
      - run: python -m pytest tests/test_property.py

  rootless-sandbox-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: podman info --format '{{.Host.Security.Rootless}}'
      - run: podman pull python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
      - run: python -m metaforge.cli sandbox-check
        env:
          METAFORGE_SANDBOX_RUNTIME: podman
          METAFORGE_SANDBOX_IMAGE: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
      - run: python -m metaforge.cli sandbox-smoke
        env:
          METAFORGE_SANDBOX_RUNTIME: podman
          METAFORGE_SANDBOX_IMAGE: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
