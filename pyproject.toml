[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metaforge"
version = "0.6.0"
description = "A reproducible, safety-first experimental lab for evolutionary algorithm search."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]
orchestration = ["langgraph>=1.0"]
llm = ["openai-agents>=0.21.0,<1.0"]
fuzz = ["hypothesis>=6.100,<7"]

[project.scripts]
metaforge = "metaforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
